# ───────────────────────────────────────────────────────────────
# FRONTEND (dominio principal) — sirve el build de React
# Guardar como: /etc/nginx/sites-available/around-frontend
# Activar con:
#   sudo ln -s /etc/nginx/sites-available/around-frontend /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# REEMPLAZAR:
#   tudominio.example     -> tu dominio de FreeDNS
#   /home/USUARIO/...     -> la ruta real al build en el servidor
# ───────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;

    server_name tudominio.example;

    root /home/USUARIO/web_project_api_full/frontend/build;
    index index.html;

    # Importante: la app usa React Router (/signin, /signup).
    # Este fallback evita el 404 al recargar en una ruta interna.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de los assets estáticos generados por el build.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

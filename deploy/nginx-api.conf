# ───────────────────────────────────────────────────────────────
# API (subdominio) — proxy inverso al backend Node en el puerto 3001
# Guardar como: /etc/nginx/sites-available/around-api
# Activar con:
#   sudo ln -s /etc/nginx/sites-available/around-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# REEMPLAZAR:
#   api.tudominio.example -> tu subdominio para la API
# ───────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;

    server_name api.tudominio.example;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
}
